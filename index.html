<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harness hub - teste</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #2c003e;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: #4a006b;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 {
        color: #ffffff;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #ffffff;
        color: #2c003e;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background-color: #e0e0e0;
      }
      footer {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
      }
      footer a {
        color: #ffffff;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Bem-vindo ao Site</h1>
      <p>Esta é a página inicial do projeto.</p>
      <button onclick="alert('Olá! Este é um alerta do modal.')">Abrir Modal</button>
    </div>
    <footer>
      <a href="https://www.google.com" target="_blank">Visite o Google</a>

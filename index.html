<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título da página</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f4;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 {
        color: #2c3e50;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #2c3e50;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background-color: #34495e;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Bem-vindo ao Site</h1>
      <p>Esta é a página inicial do projeto.</p>
      <button onclick="alert('Olá! Este é um alerta do modal.')">Abrir Modal</button>
    </div>
  </body>
</html>

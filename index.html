<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harness hub - teste</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #2c003e;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        background-color: #4a006b;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
      nav ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      nav a {
        color: #ffffff;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        transition: color 0.3s;
      }
      nav a:hover {
        color: #e0e0e0;
        text-decoration: underline;
      }
      .container {
        max-width: 800px;
        margin: 40px auto;
        background: #4a006b;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-align: center;
        flex: 1;
      }
      h1 {
        color: #ffffff;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #ffffff;
        color: #2c003e;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background-color: #e0e0e0;
      }
      footer {
        margin-top: auto;
        text-align: center;
        font-size: 14px;
        padding: 20px;
      }
      footer a {
        color: #ffffff;
        text-decoration: none;
        background-color: #28a745;
        padding: 5px 10px;
        border-radius: 4px;
      }
      footer a:hover {
        text-decoration: underline;
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#price">Price</a></li>
        </ul>
      </nav>
    </header>
    <div class="container">
      <h1>Bem-vindo ao Site</h1>
      <p>Esta é a página inicial do projeto.</p>
      <button onclick="alert('Olá! Este é um alerta do modal.')">Abrir Modal</button>
    </div>
    <footer>
      <a href="https://www.google.com" target="_blank">Visite o Google</a>
    </footer>
  </body>
</html>
